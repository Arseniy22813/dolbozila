<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все эпизоды ФЫКЯ — Dolbozilla</title>
    <link rel="stylesheet" href="./style/style.css">
    <link rel="stylesheet" href="./style/video.css">
</head>
<body>
    <header>
        <a href="./index.html">
            <img src="./svg/dolbo_logo_v002.png" alt="Dolbozilla logo" class="dolbozilla_name">
        </a>
    </header>

    <main class="video-page">
        <h2 class="page-title">Все эпизоды ФЫКЯ</h2>

        <!-- Телевизор -->
        <section class="tv">
            <button class="tv-arrow tv-arrow--prev" type="button" aria-label="Предыдущее видео"></button>

            <div class="tv-screen">
                <div class="tv-oval">
                    
                </div>
            </div>

            <button class="tv-arrow tv-arrow--next" type="button" aria-label="Следующее видео"></button>
        </section>

        <!-- Карусель обложек -->
        <section class="carousel" id="carousel">
            <div class="carousel-track" id="carousel-track">
                
            </div>
        </section>
    </main>

    <script src="./js/script.js"></script>
</body>
</html>
